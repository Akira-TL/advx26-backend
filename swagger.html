<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multimedia Package Backend — API 文档</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; }
    .swagger-ui .topbar { background-color: #1b1b1b; }
    .swagger-ui .topbar .download-url-wrapper .select-label { display: flex; align-items: center; width: max-content; }
    .swagger-ui .topbar .download-url-wrapper .select-label span { color: #fff; font-size: 14px; }
    .swagger-ui .topbar .download-url-wrapper input[type=text] { border: 2px solid #4a90d9; }
    .swagger-ui .info .title { font-size: 28px; }
    .swagger-ui .scheme-container { box-shadow: none; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
<script>
SwaggerUIBundle({
  spec: {
    "openapi": "3.0.3",
    "info": {
      "title": "Multimedia Package Backend",
      "description": "接收、存储并分发音频、STL、WebM 和 JSON 元数据包。",
      "version": "1.0.0"
    },
    "servers": [{"url": "http://localhost:8000", "description": "本地开发服务器"}],
    "tags": [
      {"name": "系统", "description": "健康检查与就绪探针"},
      {"name": "数据包", "description": "多媒体数据包的增删查及文件下载"}
    ],
    "paths": {
      "/api/v1/health": {
        "get": {
          "tags": ["系统"],
          "summary": "健康检查",
          "operationId": "health",
          "responses": {
            "200": {
              "description": "服务正常",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {"status": {"type": "string", "example": "ok"}}
                  }
                }
              }
            }
          }
        }
      },
      "/api/v1/ready": {
        "get": {
          "tags": ["系统"],
          "summary": "就绪检查",
          "description": "检查数据库和存储是否可用",
          "operationId": "ready",
          "responses": {
            "200": {
              "description": "服务就绪",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {"status": {"type": "string", "example": "ready"}}
                  }
                }
              }
            },
            "503": {
              "description": "存储或数据库不可用",
              "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}
            }
          }
        }
      },
      "/api/v1/packages": {
        "post": {
          "tags": ["数据包"],
          "summary": "创建数据包",
          "description": "上传音频、3D 模型（STL）和视频（WebM）文件，附带 JSON 元数据。\n需要 Bearer Token 认证（如果服务端配置了 BACKEND_API_TOKEN）。",
          "operationId": "createPackage",
          "security": [{"BearerAuth": []}],
          "requestBody": {
            "required": true,
            "content": {
              "multipart/form-data": {
                "schema": {
                  "type": "object",
                  "required": ["metadata", "audio", "model", "video"],
                  "properties": {
                    "metadata": {"type": "string", "description": "JSON 格式的元数据字符串（最大 64 KiB）"},
                    "audio": {"type": "string", "format": "binary", "description": "音频文件（最大 100 MB）"},
                    "model": {"type": "string", "format": "binary", "description": "3D 模型文件（最大 500 MB），必须为 .stl 扩展名"},
                    "video": {"type": "string", "format": "binary", "description": "视频文件（最大 2 GB），必须为 .webm 扩展名"}
                  }
                }
              }
            }
          },
          "responses": {
            "201": {"description": "数据包创建成功", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PackageCreated"}}}},
            "400": {"description": "请求参数无效", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
            "401": {"description": "无效或缺少 Bearer Token", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
            "413": {"description": "文件超过大小限制", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        },
        "get": {
          "tags": ["数据包"],
          "summary": "列出数据包",
          "description": "分页查询数据包列表，支持按创建者、状态和标签过滤。",
          "operationId": "listPackages",
          "parameters": [
            {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}, "description": "每页返回数量"},
            {"name": "offset", "in": "query", "schema": {"type": "integer", "minimum": 0, "default": 0}, "description": "偏移量"},
            {"name": "creator_id", "in": "query", "schema": {"type": "string"}, "description": "按创建者 ID 过滤"},
            {"name": "status", "in": "query", "schema": {"type": "string"}, "description": "按状态过滤（如 ready、deleted）"},
            {"name": "tag", "in": "query", "schema": {"type": "string"}, "description": "按标签过滤"}
          ],
          "responses": {
            "200": {"description": "数据包列表", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PackageList"}}}}
          }
        }
      },
      "/api/v1/packages/{package_id}": {
        "get": {
          "tags": ["数据包"],
          "summary": "获取数据包详情",
          "description": "返回数据包的完整 manifest 信息。",
          "operationId": "getPackage",
          "parameters": [{"$ref": "#/components/parameters/PackageId"}],
          "responses": {
            "200": {"description": "数据包 manifest", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Manifest"}}}},
            "404": {"description": "数据包不存在", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
            "500": {"description": "manifest 文件损坏", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        },
        "delete": {
          "tags": ["数据包"],
          "summary": "删除数据包",
          "description": "软删除指定数据包（标记为 deleted 状态）。需要 Bearer Token 认证。",
          "operationId": "deletePackage",
          "security": [{"BearerAuth": []}],
          "parameters": [{"$ref": "#/components/parameters/PackageId"}],
          "responses": {
            "204": {"description": "删除成功，无返回内容"},
            "401": {"description": "无效或缺少 Bearer Token", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
            "404": {"description": "数据包不存在", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        }
      },
      "/api/v1/packages/{package_id}/manifest": {
        "get": {
          "tags": ["数据包"],
          "summary": "获取数据包 manifest",
          "description": "返回完整 manifest JSON。",
          "operationId": "getManifest",
          "parameters": [{"$ref": "#/components/parameters/PackageId"}],
          "responses": {
            "200": {"description": "数据包 manifest", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Manifest"}}}},
            "404": {"description": "数据包不存在", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        }
      },
      "/api/v1/packages/{package_id}/files/{kind}": {
        "get": {
          "tags": ["数据包"],
          "summary": "下载数据包文件",
          "description": "下载指定类型的文件（audio / model / video）。\n支持 Range 请求（断点续传）和 ETag 条件请求。",
          "operationId": "getFile",
          "parameters": [
            {"$ref": "#/components/parameters/PackageId"},
            {"name": "kind", "in": "path", "required": true, "schema": {"type": "string", "enum": ["audio", "model", "video"]}, "description": "文件类型"},
            {"name": "Range", "in": "header", "schema": {"type": "string"}, "description": "字节范围请求，格式：bytes=start-end", "example": "bytes=0-1023"},
            {"name": "If-None-Match", "in": "header", "schema": {"type": "string"}, "description": "ETag 条件请求"}
          ],
          "responses": {
            "200": {
              "description": "完整文件内容",
              "headers": {
                "Accept-Ranges": {"schema": {"type": "string", "example": "bytes"}},
                "ETag": {"schema": {"type": "string", "example": "\"sha256-abc123...\""}},
                "Content-Disposition": {"schema": {"type": "string", "example": "inline; filename=\"audio.mp3\""}}
              },
              "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}
            },
            "206": {
              "description": "部分内容（Range 请求）",
              "headers": {
                "Content-Range": {"schema": {"type": "string", "example": "bytes 0-1023/5000"}},
                "Accept-Ranges": {"schema": {"type": "string", "example": "bytes"}},
                "ETag": {"schema": {"type": "string"}}
              },
              "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}
            },
            "304": {"description": "未修改（ETag 匹配）"},
            "404": {"description": "数据包或文件类型不存在", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
            "416": {"description": "请求范围无效"},
            "500": {"description": "数据文件丢失", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        },
        "head": {
          "tags": ["数据包"],
          "summary": "获取文件元信息",
          "description": "返回文件的大小、ETag 等头部信息，不返回文件内容。",
          "operationId": "headFile",
          "parameters": [
            {"$ref": "#/components/parameters/PackageId"},
            {"name": "kind", "in": "path", "required": true, "schema": {"type": "string", "enum": ["audio", "model", "video"]}, "description": "文件类型"}
          ],
          "responses": {
            "200": {
              "description": "文件元信息",
              "headers": {
                "Content-Length": {"schema": {"type": "integer"}},
                "Accept-Ranges": {"schema": {"type": "string", "example": "bytes"}},
                "ETag": {"schema": {"type": "string"}}
              }
            },
            "404": {"description": "数据包或文件类型不存在"}
          }
        }
      },
      "/api/v1/packages/{package_id}/bundle": {
        "get": {
          "tags": ["数据包"],
          "summary": "下载数据包压缩包",
          "description": "将 manifest 和所有文件打包为 ZIP 下载。",
          "operationId": "getBundle",
          "parameters": [{"$ref": "#/components/parameters/PackageId"}],
          "responses": {
            "200": {
              "description": "ZIP 压缩包",
              "headers": {
                "Content-Disposition": {"schema": {"type": "string", "example": "attachment; filename=\"abc123...zip\""}}
              },
              "content": {"application/zip": {"schema": {"type": "string", "format": "binary"}}}
            },
            "404": {"description": "数据包不存在", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
          }
        }
      }
    },
    "components": {
      "securitySchemes": {
        "BearerAuth": {
          "type": "http",
          "scheme": "bearer",
          "description": "通过环境变量 BACKEND_API_TOKEN 配置的 API 令牌"
        }
      },
      "parameters": {
        "PackageId": {
          "name": "package_id",
          "in": "path",
          "required": true,
          "schema": {"type": "string", "pattern": "^[0-9a-f]{32}$"},
          "description": "数据包 ID（32 位十六进制字符串）",
          "example": "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
        }
      },
      "schemas": {
        "Error": {
          "type": "object",
          "properties": {"detail": {"type": "string", "description": "错误描述信息"}},
          "required": ["detail"]
        },
        "Creator": {
          "type": "object",
          "properties": {
            "id": {"type": "string", "minLength": 1, "maxLength": 128, "description": "创建者 ID"},
            "name": {"type": "string", "minLength": 1, "maxLength": 256, "description": "创建者名称"}
          },
          "required": ["id", "name"]
        },
        "PackageCreated": {
          "type": "object",
          "properties": {
            "package_id": {"type": "string", "description": "新创建的数据包 ID", "example": "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"},
            "status": {"type": "string", "example": "ready"},
            "manifest_url": {"type": "string", "description": "manifest 访问路径", "example": "/api/v1/packages/{id}/manifest"}
          },
          "required": ["package_id", "status", "manifest_url"]
        },
        "PackageSummary": {
          "type": "object",
          "properties": {
            "package_id": {"type": "string"},
            "title": {"type": "string"},
            "description": {"type": "string"},
            "creator": {"$ref": "#/components/schemas/Creator"},
            "created_at": {"type": "string", "format": "date-time", "description": "创建时间（ISO 8601 UTC）"},
            "received_at": {"type": "string", "format": "date-time", "description": "接收时间（ISO 8601 UTC）"},
            "status": {"type": "string", "example": "ready"},
            "tags": {"type": "array", "items": {"type": "string"}},
            "total_size": {"type": "integer", "description": "所有文件总大小（字节）"}
          },
          "required": ["package_id", "title", "description", "creator", "created_at", "received_at", "status", "tags", "total_size"]
        },
        "PackageList": {
          "type": "object",
          "properties": {
            "items": {"type": "array", "items": {"$ref": "#/components/schemas/PackageSummary"}},
            "total": {"type": "integer", "description": "符合条件的总记录数"},
            "limit": {"type": "integer"},
            "offset": {"type": "integer"}
          },
          "required": ["items", "total", "limit", "offset"]
        },
        "FileInfo": {
          "type": "object",
          "properties": {
            "filename": {"type": "string", "description": "存储文件名"},
            "original_filename": {"type": "string", "description": "原始上传文件名"},
            "content_type": {"type": "string", "description": "MIME 类型"},
            "size": {"type": "integer", "description": "文件大小（字节）"},
            "sha256": {"type": "string", "description": "文件 SHA-256 哈希"}
          },
          "required": ["filename", "original_filename", "content_type", "size", "sha256"]
        },
        "Manifest": {
          "type": "object",
          "properties": {
            "schema_version": {"type": "string", "example": "1.0"},
            "package_id": {"type": "string"},
            "title": {"type": "string"},
            "description": {"type": "string"},
            "creator": {"$ref": "#/components/schemas/Creator"},
            "created_at": {"type": "string", "format": "date-time"},
            "received_at": {"type": "string", "format": "date-time"},
            "status": {"type": "string"},
            "tags": {"type": "array", "items": {"type": "string"}},
            "files": {
              "type": "object",
              "properties": {
                "audio": {"$ref": "#/components/schemas/FileInfo"},
                "model": {"$ref": "#/components/schemas/FileInfo"},
                "video": {"$ref": "#/components/schemas/FileInfo"}
              }
            },
            "custom_metadata": {"type": "object", "additionalProperties": true, "description": "自定义元数据（最大 64 KiB）"}
          },
          "required": ["schema_version", "package_id", "title", "description", "creator", "created_at", "received_at", "status", "tags", "files", "custom_metadata"]
        }
      }
    }
  },
  dom_id: "#swagger-ui",
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
  plugins: [SwaggerUIBundle.plugins.DownloadUrl],
  layout: "StandaloneLayout",
  defaultModelsExpandDepth: 2,
  defaultModelExpandDepth: 2,
  docExpansion: "list",
  filter: true,
  showExtensions: true,
  tryItOutEnabled: true
});
</script>
</body>
</html>
